name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      target_env:
        description: 'choose env'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      ENV: ${{ github.event.inputs.target_env || 'dev'}}
      
    steps:
    - uses: actions/checkout@v4

    # 1. creat Docker image
    - name: Build Docker image
      run: docker build -t my-practice-app .

    # 2. run test on container
    - name: Run Playwright tests in Docker
      env:
        TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      run: |
        docker run --rm \
          -e ENV="${ENV}" \
          -e TEST_EMAIL="${TEST_EMAIL}" \
          -e TEST_PASSWORD="${TEST_PASSWORD}" \
          -v ${{ github.workspace }}/playwright-report:/practiceapp/playwright-report \
          my-practice-app npx playwright test

    # 3. test report upload
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 30